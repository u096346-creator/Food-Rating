<!doctype html><html lang="ar" dir="rtl"><head>  <meta charset="utf-8" />  <meta name="viewport" content="width=device-width,initial-scale=1" />  <title>???? ??????</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>    body{font-family:system-ui;max-width:1000px;margin:20px auto;padding:0 12px}    .card{border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}    input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc}    button{background:#111;color:#fff;border:none;cursor:pointer;margin-top:10px}    table{width:100%;border-collapse:collapse}    th,td{border-bottom:1px solid #eee;padding:10px;text-align:right}    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}    @media (max-width:720px){.row{grid-template-columns:1fr}}    .msg{color:#0a7}    .err{color:#c00}  </style></head><body>  <h2>???? ?????? (Admin)</h2>  <div id="login" class="card">    <h3>????? ???? ??????</h3>    <input id="email" placeholder="Email" />    <input id="pass" type="password" placeholder="Password" />    <button id="btnLogin">????</button>    <div id="loginStatus"></div>  </div>  <div id="panel" class="card" style="display:none">    <div class="row">      <div>        <label>?????</label>        <select id="day">          <option value="">????</option>          <option value="1">Day 1</option><option value="2">Day 2</option><option value="3">Day 3</option>          <option value="4">Day 4</option><option value="5">Day 5</option><option value="6">Day 6</option>          <option value="7">Day 7</option>        </select>      </div>      <div>        <label>??????</label>        <select id="meal">          <option value="">????</option>          <option value="breakfast">???????</option>          <option value="lunch">??????</option>          <option value="dinner">??????/??????</option>        </select>      </div>    </div>    <button id="load">??? ???????</button>    <button id="logout">????? ????</button>    <div id="out" style="margin-top:14px"></div>  </div><script>const SUPABASE_URL = "PUT_YOUR_SUPABASE_URL_HERE";const SUPABASE_ANON = "PUT_YOUR_SUPABASE_ANON_KEY_HERE";const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);async function refreshUI(){  const { data } = await supabase.auth.getSession();  const logged = !!data.session;  document.getElementById('login').style.display = logged ? 'none' : 'block';  document.getElementById('panel').style.display = logged ? 'block' : 'none';}document.getElementById('btnLogin').addEventListener('click', async () => {  const email = document.getElementById('email').value.trim();  const password = document.getElementById('pass').value.trim();  const st = document.getElementById('loginStatus');  st.textContent = '';  const { error } = await supabase.auth.signInWithPassword({ email, password });  if(error) st.innerHTML = `<div class="err">${error.message}</div>`;  else st.innerHTML = `<div class="msg">?? ????? ??????</div>`;  refreshUI();});document.getElementById('logout').addEventListener('click', async () => {  await supabase.auth.signOut();  refreshUI();});document.getElementById('load').addEventListener('click', async () => {  const day = document.getElementById('day').value;  const meal = document.getElementById('meal').value;  const out = document.getElementById('out');  out.innerHTML = '... ???? ???????';  let q = supabase.from('v_item_avg').select('*').eq('week_no', 1).order('avg_total', {ascending:false});  if(day) q = q.eq('day_no', Number(day));  if(meal) q = q.eq('meal', meal);  const { data, error } = await q;  if(error){    out.innerHTML = `<div class="err">???: ${error.message}</div>`;    return;  }  if(!data || data.length === 0){    out.innerHTML = `<div class="err">?? ???? ?????? ???.</div>`;    return;  }  const rows = data.map(r => `    <tr>      <td>${r.day_no}</td>      <td>${r.meal}</td>      <td>${r.category}</td>      <td>${r.item_name}</td>      <td>${r.votes}</td>      <td>${r.avg_total}</td>      <td>${r.avg_taste}</td>      <td>${r.avg_quality}</td>      <td>${r.avg_quantity}</td>      <td>${r.avg_temperature}</td>    </tr>  `).join('');  out.innerHTML = `    <div class="card">      <h3>???? ??????? (Week 1)</h3>      <table>        <thead>          <tr>            <th>?????</th><th>??????</th><th>???????</th><th>?????</th><th>??? ?????????</th>            <th>??????? ?????</th><th>?????</th><th>??????</th><th>??????</th><th>???????</th>          </tr>        </thead>        <tbody>${rows}</tbody>      </table>    </div>  `;});refreshUI();</script></body></html>
