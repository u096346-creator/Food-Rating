<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقييم الوجبات</title>

<style>
body{
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: 40px auto;
  padding: 20px;
}
.card{
  border:1px solid #ddd;
  padding:20px;
  border-radius:12px;
}
select, button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
}
button{
  background:black;
  color:white;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<h2>تقييم الوجبات</h2>

<div class="card">
<label>اختر اليوم:</label>
<select id="day">
<option value="1">اليوم الأول</option>
<option value="2">اليوم الثاني</option>
<option value="3">اليوم الثالث</option>
<option value="4">اليوم الرابع</option>
<option value="5">اليوم الخامس</option>
<option value="6">اليوم السادس</option>
<option value="7">اليوم السابع</option>
</select>

<label>اختر الوجبة:</label>
<select id="meal">
<option value="breakfast">الإفطار</option>
<option value="lunch">الغداء</option>
<option value="dinner">العشاء / السحور</option>
</select>

<button onclick="start()">ابدأ التقييم</button>
</div>

<script>
function start(){
  let day = document.getElementById("day").value;
  let meal = document.getElementById("meal").value;
  window.location.href = "rate.html?day=" + day + "&meal=" + meal;
}
</script>

</body>
</html>
