<!doctype html><html lang="ar" dir="rtl"><head>  <meta charset="utf-8" />  <meta name="viewport" content="width=device-width,initial-scale=1" />  <title>????? ???????</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>    body{font-family:system-ui;max-width:900px;margin:20px auto;padding:0 12px}    .top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}    .badge{background:#f2f2f2;padding:8px 10px;border-radius:999px}    .cat{margin:18px 0 8px;font-weight:700}    .item{border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0}    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}    @media (max-width:720px){.row{grid-template-columns:1fr}}    .stars{display:flex;gap:8px;flex-wrap:wrap;align-items:center}    .stars label{border:1px solid #ccc;border-radius:999px;padding:6px 10px;cursor:pointer}    .stars input{display:none}    .stars input:checked + span{font-weight:700}    textarea{width:100%;min-height:60px;padding:10px;border-radius:10px;border:1px solid #ccc}    button{width:100%;padding:14px;border-radius:12px;border:none;background:#111;color:#fff;cursor:pointer;margin-top:12px}    .issues{display:flex;gap:10px;flex-wrap:wrap}    .issues label{border:1px dashed #bbb;border-radius:999px;padding:6px 10px;cursor:pointer}    .msg{margin:10px 0;color:#0a7}    .err{margin:10px 0;color:#c00}  </style></head><body>  <div class="top">    <h2>????? ???????</h2>    <div id="meta" class="badge"></div>  </div>  <div id="list"></div>  <div id="status"></div>  <button id="submit">????? ???????</button><script>/** 1) ?? ?????? Supabase ??? */const SUPABASE_URL = "https://iprchwsywzxiknrsvayd.supabase.co";const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwcmNod3N5d3p4aWtucnN2YXlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0MTY4MDEsImV4cCI6MjA4Njk5MjgwMX0.6LtAM2ofWMOFOTYZV9u4g0ATkPKza1AjrSyxEQ0Lx2k";const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);const params = new URLSearchParams(location.search);const week = Number(params.get('week') || 1);const day  = Number(params.get('day') || 1);const meal = params.get('meal') || 'breakfast';document.getElementById('meta').textContent = `Week ${week} — Day ${day} — ${meal}`;const ISSUE_OPTIONS = [  "????", "????", "??? ????", "??? ????", "?????? ?????", "?????? ?????",  "?????? ?????", "???/????", "??????? ????? ?????", "??? ????? ?????"];function starGroup(name, defaultVal=5){  // ???? 1..5 (?????? radio)  let html = `<div class="stars">`;  for(let v=1; v<=5; v++){    const id = `${name}_${v}_${Math.random().toString(16).slice(2)}`;    const checked = (v===defaultVal) ? 'checked' : '';    html += `      <label>        <input type="radio" name="${name}" value="${v}" ${checked}/>        <span>${v} ?</span>      </label>    `;  }  html += `</div>`;  return html;}function renderItem(item){  const boxId = `item_${item.id}`;  const issuesHtml = ISSUE_OPTIONS.map(opt => {    const iid = `${boxId}_iss_${opt}`;    return `      <label>        <input type="checkbox" value="${opt}" data-issue="${item.id}" />        ${opt}      </label>    `;  }).join('');  return `  <div class="item" data-item="${item.id}">    <div style="font-weight:700;margin-bottom:8px">${item.item_name}</div>    <div class="row">      <div>        <div>?????</div>        ${starGroup(`taste_${item.id}`, 5)}      </div>      <div>        <div>??????</div>        ${starGroup(`quality_${item.id}`, 5)}      </div>      <div>        <div>??????</div>        ${starGroup(`quantity_${item.id}`, 5)}      </div>      <div>        <div>???????</div>        ${starGroup(`temperature_${item.id}`, 5)}      </div>    </div>    <div style="margin:10px 0 6px;font-weight:600">??????? ?????</div>    <div class="issues">${issuesHtml}</div>    <div style="margin:10px 0 6px;font-weight:600">?????? ?????? (???????)</div>    <textarea placeholder="???? ?????? ??? ???..." data-note="${item.id}"></textarea>  </div>  `;}async function loadMenu(){  // ???? meal_id ?????  const { data: mealRow, error: mealErr } = await supabase    .from('meals')    .select('id, week_no, day_no, meal')    .eq('week_no', week)    .eq('day_no', day)    .eq('meal', meal)    .single();  if(mealErr){    document.getElementById('list').innerHTML = `<div class="err">???? ????? ??????: ${mealErr.message}</div>`;    return;  }  const { data: items, error: itemsErr } = await supabase    .from('menu_items')    .select('id, category, item_name, sort_order')    .eq('meal_id', mealRow.id)    .order('category', { ascending: true })    .order('sort_order', { ascending: true });  if(itemsErr){    document.getElementById('list').innerHTML = `<div class="err">???? ????? ???????: ${itemsErr.message}</div>`;    return;  }  if(!items || items.length === 0){    document.getElementById('list').innerHTML = `<div class="err">?? ???? ????? ???? ?????? ???. (????? ?? Supabase)</div>`;    return;  }  // ??? ??? ???????  const grouped = {};  for(const it of items){    grouped[it.category] = grouped[it.category] || [];    grouped[it.category].push(it);  }  let html = '';  for(const cat of Object.keys(grouped)){    html += `<div class="cat">${cat}</div>`;    for(const it of grouped[cat]){      html += renderItem(it);    }  }  document.getElementById('list').innerHTML = html;}function getRadioValue(name){  const el = document.querySelector(`input[name="${name}"]:checked`);  return el ? Number(el.value) : 5;}function getIssuesForItem(itemId){  const boxes = document.querySelectorAll(`input[type="checkbox"][data-issue="${itemId}"]:checked`);  return Array.from(boxes).map(b => b.value);}function getNoteForItem(itemId){  const ta = document.querySelector(`textarea[data-note="${itemId}"]`);  return (ta && ta.value) ? ta.value.trim() : '';}async function submitAll(){  const status = document.getElementById('status');  status.innerHTML = '';  // ???? ?? items ?? ??????  const itemDivs = document.querySelectorAll('.item[data-item]');  if(itemDivs.length === 0){    status.innerHTML = `<div class="err">?? ???? ????? ???????.</div>`;    return;  }  // 1) ???? Submission  const { data: sub, error: subErr } = await supabase    .from('submissions')    .insert([{ week_no: week, day_no: day, meal }])    .select('id')    .single();  if(subErr){    status.innerHTML = `<div class="err">???? ????? ??????? (submission): ${subErr.message}</div>`;    return;  }  // 2) ??? item_ratings bulk insert  const rows = [];  itemDivs.forEach(div => {    const itemId = Number(div.getAttribute('data-item'));    rows.push({      submission_id: sub.id,      menu_item_id: itemId,      taste: getRadioValue(`taste_${itemId}`),      quality: getRadioValue(`quality_${itemId}`),      quantity: getRadioValue(`quantity_${itemId}`),      temperature: getRadioValue(`temperature_${itemId}`),      issues: getIssuesForItem(itemId),      note: getNoteForItem(itemId)    });  });  const { error: insErr } = await supabase.from('item_ratings').insert(rows);  if(insErr){    status.innerHTML = `<div class="err">?? ????? ???? ??????? ??? ??? ??? ???????: ${insErr.message}</div>`;    return;  }  status.innerHTML = `<div class="msg">? ?? ????? ??????? ?????? ????? ??</div>`;  document.getElementById('submit').disabled = true;}document.getElementById('submit').addEventListener('click', submitAll);loadMenu();</script></body></html>
